<!DOCTYPE html>
<html>


<head>
    <meta charset="UTF-8">
    <meta content="width=width-device, initial-scale=1.0">
    <title>Rock,Paper,Scissor</title>
    <link rel="stylesheet" href="style.css">
    <script src="program.js" defer></script>

</head>



<body>

    <div class="CCards">
        <div id="Cscissor">
            <img src="images/scissors.gif">
        </div>
        
        <div  id="Crock">
            <img src="images/ROCK.gif">
        </div>

        <div  id="Cpaper">
            <img src="images/paper.gif">
        </div>
    </div>

    <div class="Score">
        <div id="Computer">
            <span>Computer</span>
            <div id="Cscore">0</div>
        </div>

        <div id="Human">
            <span>YOU</span>
            <div id="Hscore">0</div>
        </div>
    </div>

    <div class="Cards">
        <button id="Scissor"><img src="images/scissors.gif"></button>
        <button id="Rock"><img src="images/ROCK.gif"></button>
        <button id="Paper"><img src="images/paper.gif"></button>
    </div>

</body>



</html>
